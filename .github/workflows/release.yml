name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be in the form v1.2.3: $TAG" >&2
            exit 1
          fi
          jq --arg version "$version" '.version = $version' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - run: npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Package
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          codesign --force --deep --sign - Khorus.app
          ditto -c -k --keepParent Khorus.app "$GITHUB_WORKSPACE/Khorus.zip"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Khorus.zip --clobber
